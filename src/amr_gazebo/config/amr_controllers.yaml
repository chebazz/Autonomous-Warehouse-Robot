# Controladores ros2_control del AMR
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz (suficiente para la base; reduce carga de joint_states/odometría)
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Encoders de ruedas + posición del elevador → /joint_states
joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

# Cinemática omnidireccional + odometría por encoders (→ /odom/wheel)
mecanum_drive_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 0.5   # s sin comandos → parada

    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    front_left_wheel_state_joint_name: front_left_wheel_joint
    front_right_wheel_state_joint_name: front_right_wheel_joint
    rear_left_wheel_state_joint_name: rear_left_wheel_joint
    rear_right_wheel_state_joint_name: rear_right_wheel_joint

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.10
      # lx + ly = semi-batalla + semi-vía = 0.45 + 0.30
      sum_of_robot_center_projection_on_X_Y_axis: 0.75

    base_frame_id: base_footprint
    odom_frame_id: odom
    # El TF odom → base_footprint lo publica el EKF (amr_navigation/config/ekf.yaml),
    # que fusiona esta odometría (/odom/wheel) con el IMU.
    enable_odom_tf: false
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

# Elevador: lift_joint = altura de elevación (0 .. 1.0 m)
# Usar: ros2 run amr_gazebo lift_cmd.py <altura_m>
lift_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - lift_joint
    # Mando por velocidad + PID de posición (más robusto en Gazebo/DART
    # que el modo posición de gz_ros2_control)
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      lift_joint: { p: 4.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0 }
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      goal_time: 2.0
      lift_joint: { goal: 0.005 }
